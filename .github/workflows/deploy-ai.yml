# Déploie automatiquement la fonction Supabase « ai » (coach IA, photo, recherche d'aliments)
# à chaque push sur main qui modifie supabase/functions/**.
# Lancement manuel possible : onglet Actions > « Déployer le coach IA » > Run workflow.
#
# À configurer une seule fois dans GitHub (Settings > Secrets and variables > Actions) :
#   Secret   SUPABASE_ACCESS_TOKEN  jeton personnel Supabase (supabase.com/dashboard/account/tokens)
#   Variable SUPABASE_PROJECT_REF   optionnelle, sinon le projet Kcalculator ci-dessous est utilisé
#
# La clé de l'API IA reste dans les secrets de la fonction Supabase : ce workflow n'y touche pas.
name: Déployer le coach IA

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

concurrency:
  group: deploy-supabase-ai
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'pgliqvappeorkwygyppx' }}
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier le jeton Supabase
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Ajoute le secret SUPABASE_ACCESS_TOKEN dans Settings > Secrets and variables > Actions."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Déployer la fonction ai (sans Docker)
        run: supabase functions deploy ai --project-ref "$PROJECT_REF" --use-api
